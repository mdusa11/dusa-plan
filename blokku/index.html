<style>

  background:var(--surf2);border:1px solid var(--line);transition:transform .08s}

.st-listo{background:var(--surf2);color:var(--muted)}.st-programado{background:#173A75;color:#9CCBFF}.st-publicado{background:#0F4A36;color:#7EF0C3}

.pthumb{width:54px;aspect-ratio:9/16;object-fit:cover;border-radius:9px;flex:0 0 auto;background:#000}
.pbody{flex:1;min-width:0;display:grid;gap:3px}
.pdate{font-size:12.5px;font-weight:800;color:var(--blue)}.pdate .late{color:var(--red)}.pdate .cond{color:var(--gold)}

.pmeta{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.fmt{font-size:11.5px;color:var(--faint);font-weight:700}
.empty{padding:26px 10px;text-align:center;color:var(--muted)}
.ov{position:fixed;inset:0;z-index:50;background:rgba(2,6,20,.66);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#0E1A46;border:1px solid var(--line);width:100%;max-width:560px;max-height:94vh;overflow-y:auto;border-radius:22px 22px 0 0;
  padding:10px 16px calc(22px + env(safe-area-inset-bottom));animation:up .25s cubic-bezier(.2,.8,.2,1);outline:none}

.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.mdate{font-size:13px;font-weight:800;color:var(--blue);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.x{width:36px;height:36px;border-radius:50%;background:var(--surf2);font-size:18px;flex:0 0 auto}
.netseg{margin-top:14px;display:flex}.netseg .seg{width:100%}.netseg .seg button{flex:1;font-size:14px;padding:9px}
.slider{position:relative;margin:14px -16px 0}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;gap:10px;padding:0 16px}
.slides::-webkit-scrollbar{display:none}
.slides figure{position:relative;flex:0 0 84%;scroll-snap-align:center;border-radius:14px;overflow:hidden;background:#000}
.slides.p figure{aspect-ratio:4/5;flex:0 0 auto;height:min(52vh,560px)}.slides.t figure{aspect-ratio:9/16;flex:0 0 auto;height:min(52vh,600px)}
.slides.one figure{margin:0 auto}
.slides img,.slides video{width:100%;height:100%;object-fit:cover}
.dots{display:flex;justify-content:center;gap:6px;margin-top:10px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--blue);width:18px;border-radius:4px}
.note{margin-top:14px;background:#4A3A0E;color:#FFE08A;border-radius:12px;padding:10px 12px;font-size:13.5px;font-weight:700}
.vnote{margin-top:14px;background:#13306A;color:#CFE3FF;border-radius:12px;padding:12px;font-size:13.5px;font-weight:600}
.vnote b{color:#fff}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.hint{font-size:12.5px;color:var(--muted);margin-top:8px;text-align:center}
.mstatus{margin-top:16px;display:flex}.mstatus .seg{width:100%}.mstatus .seg button{flex:1}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#06143A;
  font-size:14px;font-weight:800;padding:11px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;z-index:60}
.toast.on{opacity:1;transform:translateX(-50%)}
footer{margin-top:28px;text-align:center;font-size:12px;color:var(--faint)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
const APP = {"items": [{"id": "v01", "type": "video", "date": "2026-10-10", "title": "Llegó Blokku", "when": "", "note": "", "ig_text": "Llegó Blokku 🟦💥 El puzzle de bloques que se juega sin internet. Gratis en Google Play: enlace en la bio.\n\n#Blokku #juegosdepuzzle #blockpuzzle #juegosgratis #juegossininternet", "tt_text": "Llegó Blokku 🟦💥 Gratis y sin internet. Enlace en el perfil. #Blokku #juegosdepuzzle #blockpuzzle #juegosgratis #fyp", "secs": 20, "cover": {"full": "img/v01/portada.jpg?v=8b6a9257", "thumb": "img/v01/tportada.jpg?v=a397b116"}, "prompt": "# V01-lanzamiento — Llegó Blokku (lanzamiento)\n\n**Duración:** 20 s · **Publicación:** sáb 10 oct · apertura de las cuentas · **Sale en:** TikTok + Instagram Reels (el mismo archivo)\n**Grabaciones que necesita:** G01, G02–G06, G07, G08, G09, G15 (ver 00-GRABACIONES.md)\n\n## Objetivo\nPresentar el juego en 20 s a alguien que nunca lo ha visto y llevarlo a Google Play. Es el video que se fija arriba del perfil.\n\n## Música y ritmo\nCelebración, energía alta. Música 124–128 BPM con golpes que caen justo en cada línea que revienta.\nEfectos del juego en `blokku-ads/public/audio`: `clear.mp3`, `combo.mp3`, `place_jewel.mp3`, `wildcard.mp3`,\n`levelup.mp3`, `perfect.mp3`, `gameover.mp3`, `button.mp3`. Música: libre de derechos (o una de la biblioteca\ncomercial de TikTok al subirlo).\n\n## Guion cuadro por cuadro\n\n| Tiempo | Imagen | Texto en pantalla (exacto) |\n|---|---|---|\n| 0.0–1.5 | Fondo navy vacío. Las 4 gemas del icono caen una por una desde arriba y encajan en 2×2 al centro (cada una con `place_jewel.mp3`). Al encajar la 4.ª: destello blanco y estallido de partículas. | LLEGÓ (Fredoka 180 px, oro, pop) |\n| 1.5–4.0 | El icono sube y se encoge; entra el wordmark BLOKKU con golpe (escala 1.3→1, sacudida de 6 px). Sticker menta debajo. | Sticker: YA EN GOOGLE PLAY |\n| 4.0–9.0 | G01 a pantalla grande (encuadre `board`, zoom 1.08→1). Corta a 3 momentos en que revientan líneas; `Bursts` sincronizados. Cada palabra entra en el golpe de un clear. | Encaja. → Completa. → ¡REVIENTA! (la última en rosa) |\n| 9.0–12.0 | Montaje rápido 4 × 0.75 s: CLÁSICO (G01), CONTRA RELOJ (G07), ZEN (G08), DESAFÍO DIARIO (G09), encuadre `game`. Sticker con el nombre de cada modo, del color del modo (azul, rosa, oro, cian). | Título fijo: 4 MODOS |\n| 12.0–15.0 | Montaje 5 × 0.6 s de los poderes (G02–G06) con su sticker e icono; `wildcard.mp3` en cada uno. | 5 PODERES / GRATIS (GRATIS en menta) |\n| 15.0–16.5 | G15: la mano activa el modo avión en la cortina y el juego sigue. Ícono de wifi tachado grande que hace pop. | SIN INTERNET (cian) |\n| 16.5–20.0 | EndCard estándar con `levelup.mp3`. | Frase: Cada bloque cuenta · línea gris: Gratis · Sin internet · 15 idiomas |\n\n## Notas\n- Primer frame (portada en el perfil): las 4 gemas ya encajadas + LLEGÓ. Si la portada va aparte, ya está hecha (`portada.png`).\n- Duración exacta 20 s; si sobra, recorta el montaje de modos, nunca el cierre.\n- Entrega: `V01-lanzamiento.mp4` (1080×1920) + un frame limpio para portada. La portada diseñada ya existe en la carpeta del día.\n\n## Contexto de marca (no cambiar)\n\n- **Blokku**: puzzle de bloques 8×8 para Android, de Dusa Solutions (Guadalajara, MX). Gratis, se juega sin internet.\n- **Formato:** 1080×1920, 30 fps (60 si la grabación lo permite), H.264 MP4, CRF 16–18, audio AAC 320 kbps, −14 LUFS.\n- **Zonas seguras (TikTok + Reels):** nada que se lea arriba de y=150, debajo de y=1500 ni a la derecha de x=960.\n  El juego puede extenderse a esas zonas; el texto no. Instagram recorta el centro 3:4 (y 240–1680) en el perfil.\n- **Paleta:** fondo degradado `#1B3072 → #10214F → #07112E`; azul `#4EA1FF`, rosa `#FF5D8F`, oro `#FFC93C`,\n  menta `#43D9A3`, cian `#3ED1E0`, texto `#F5F7FF`.\n- **Tipografía:** Fredoka Bold/SemiBold (títulos), Nunito SemiBold (textos). Ya están en `blokku-ads/public/fonts`.\n- **Títulos:** Fredoka 700, blancos con UNA línea resaltada en color, contorno `#0A1433` de ~9 % del function files(p, n) {
  if (p.type === 'video') return p.video ? [{ url: p.video, name: `${p.id}.mp4`, type: 'video/mp4' }] : [{ url: p.cover.full, name: `${p.id}-portada.jpg`, type: 'image/jpeg' }];
  return p[n].map((s, i) => ({ url: s.full, name: `${p.id}-${n === 'ig' ? 'ig' : 'tiktok'}-${i + 1}.jpg`, type: 'image/jpeg' }));
}
function paint() {
  const p = current, s = status(p), w = whenLabel(p);
  document.querySelectorAll('#mStatus button').forEach(b => b.setAttribute('aria-pressed', b.dataset.s === s));
  document.querySelectorAll('#net button').forEach(b => b.setAttribute('aria-pressed', b.dataset.n === net));
  $('#mDate').innerHTML = `<span>${esc(w.txt)}</span><span class="pill" style="--c:${color(p)}">${p.type === 'video' ? 'Video' : 'Post'}</span><span class="fmt">${format(p)}</span>`;
}
function fill() {
  const p = current;
  const sl = p.type === 'video' ? [p.cover] : p[net];
  const tall = p.type === 'video' || net === 'tt';
  slidesEl.className = 'slides ' + (tall ? 't' : 'p') + (sl.length === 1 ? ' one' : '');
  slidesEl.innerHTML = p.type === 'video' && p.video
    ? `<figure><video src="${p.video}" poster="${p.cover.full}" controls playsinline></video></figure>`
    : sl.map((s, i) => `<figure><img src="${s.full}" alt="${esc(p.title)} — ${i + 1}" ${i ? 'loading="lazy"' : ''}></figure>`).join('');
  slidesEl.scrollLeft = 0;
  $('#dots').innerHTML = sl.length > 1 ? sl.map((_, i) => `<i class="${i ? '' : 'on'}"></i>`).join('') : '';
  const txt = net === 'ig' ? p.ig_text : p.tt_text;
  $('#capT').textContent = net === 'ig' ? 'Texto para Instagram' : 'Texto para TikTok';
  $('#mCaption').textContent = txt;
  const n = files(p, net).length;
  $('#bShare').className = 'btn ' + (net === 'ig' ? 'pri' : 'tt');
  $('#bShare').textContent = p.type === 'video' && !p.video ? '② Bajar portada' : `② Subir a ${net === 'ig' ? 'Instagram' : 'TikTok'} (${n})`;
  $('#hint').textContent = p.type === 'video'
    ? (p.video ? (net === 'ig' ? 'Instagram → Reel. Usa la portada para que tu perfil se vea parejo.' : 'TikTok → sube el video y pega el texto.') : '')
    : (net === 'ig' ? 'Instagram → publicación con varias fotos, en orden.' : 'TikTok → modo foto (carrusel), en orden.');
  pack = null;
}
function openSheet(p, from) {
  current = p; lastFocus = from || document.activeElement;
  $('#mTitle').textContent = `${p.id.toUpperCase()} · ${p.title}`;
  const note = $('#mNote'); note.hidden = !p.note; note.textContent = p.note ? '⚠️ ' + p.note : '';
  const v = $('#vNote'), acts = $('#vActs');
  if (p.type === 'video' && !p.video) {
    v.hidden = false; acts.hidden = false;
    v.innerHTML = `🎬 <b>Este video lo hace tu equipo.</b> Mándales el prompt (${p.secs} s). Cuando me pases el MP4 aparece aquí listo para subir. La portada ya está hecha.`;
    $('#bPromptDl').href = p.prompt_url; $('#bPromptDl').setAttribute('download', p.prompt_url.split('/').pop());
  } else { v.hidden = true; acts.hidden = true; }
  paint(); fill();
  ov.hidden = false; document.body.style.overflow = 'hidden'; $('#sheet').scrollTop = 0; $('#sheet').focus();
}
function closeSheet() { ov.hidden = true; document.body.style.overflow = ''; current = null; lastFocus && lastFocus.focus && lastFocus.focus(); }

async function share() {
  const list = files(current, net);
  try {
    const fl = await Promise.all(list.map(async f => new File([await (await fetch(f.url)).blob()], f.name, { type: f.type })));
    if (navigator.canShare && navigator.canShare({ files: fl })) { await navigator.share({ files: fl }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  for (const f of list) { const a = document.createElement('a'); a.href = f.url; a.download = f.name; document.body.appendChild(a); a.click(); a.remove(); await new Promise(r => setTimeout(r, 400)); }
  toast(`${list.length} archivo${list.length > 1 ? 's' : ''} descargado${list.length > 1 ? 's' : ''}`);
}

document.addEventListener('click', (e) => {
  const bb = e.target.closest('[data-bio]'); if (bb) { copy(APP.perfil.bio[+bb.dataset.bio].text); return; }
  const o = e.target.closest('[data-open]'); if (o) { openSheet(byId[o.dataset.open], o); return; }
  const fb = e.target.closest('#filter button'); if (fb) { document.querySelectorAll('#filter button').forEach(b => b.setAttribute('aria-pressed', b === fb)); render(); }
});
slidesEl.addEventListener('scroll', () => {
  const w = slidesEl.firstElementChild?.getBoundingClientRect().width || 1, i = Math.round(slidesEl.scrollLeft / (w + 10));
  document.querySelectorAll('#dots i').forEach((d, k) => d.classList.toggle('on', k === i));
}, { passive: true });
$('#net').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; net = b.dataset.n; paint(); fill(); });
$('#mClose').onclick = closeSheet;
ov.addEventListener('click', (e) => { if (e.target === ov) closeSheet(); });
$('#bCopy').onclick = $('#bCopy2').onclick = () => copy(net === 'ig' ? current.ig_text : current.tt_text, 'Texto copiado ✓');
$('#bShare').onclick = share;
$('#bPrompt').onclick = () => copy(current.prompt, 'Prompt copiado ✓');
$('#mStatus').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; setStatus(current, b.dataset.s); toast(`Marcado: ${ST[b.dataset.s].toLowerCase()}`); });
document.addEventListener('keydown', (e) => { if (!ov.hidden && e.key === 'Escape') closeSheet(); });
render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
