<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5F7FB">
<meta name="robots" content="noindex">
<title>Dusa · Plan de contenido</title>
<link rel="icon" href="img/medusa.png">
<link rel="apple-touch-icon" href="img/medusa.png">
<style>
:root{
  --bg:#F5F7FB;--surf:#fff;--surf2:#EEF2F8;--ink:#0F1B2D;--muted:#566275;--faint:#8793A5;--line:#E3E8F0;
  --blue:#2477BE;--bio:#3090D5;
  --green:#15803D;--green-bg:#DCFCE7;--prog:#1D6FB8;--prog-bg:#DBEAFE;--red:#B91C1C;--red-bg:#FEE2E2;--amber:#92400E;--amber-bg:#FEF3C7;
  --shadow:0 1px 2px rgba(15,27,45,.05),0 6px 18px rgba(15,27,45,.06);--r:18px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:"Avenir Next","SF Pro Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;line-height:1.5}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
img{display:block}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px calc(40px + env(safe-area-inset-bottom))}

/* Header */
.top{padding:26px 0 18px}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:40px;height:40px;object-fit:contain;filter:drop-shadow(0 2px 6px rgba(48,144,213,.35))}
.brand b{display:block;font-size:16px;line-height:1.1}
.brand span{font-size:12.5px;color:var(--muted)}
.links{display:flex;gap:8px}
.links a{font-size:12.5px;font-weight:600;color:var(--blue);text-decoration:none;background:var(--surf);border:1px solid var(--line);
  padding:7px 12px;border-radius:999px;box-shadow:var(--shadow)}
h1{margin-top:20px;font-size:clamp(32px,8vw,46px);line-height:1;letter-spacing:-.025em;font-weight:700}
h1 span{color:var(--bio)}
.sub{margin-top:8px;color:var(--muted);font-size:14.5px}

/* Layout */
.cols{display:grid;gap:14px}
@media(min-width:960px){.cols{grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);align-items:start}.side{position:sticky;top:16px}}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.stack{display:grid;gap:14px}
.kicker{font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--blue)}
h2{font-size:21px;line-height:1.2;letter-spacing:-.01em;font-weight:700}
h3{font-size:17px;font-weight:700;letter-spacing:-.01em}
.muted{color:var(--muted)}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:14px;font-weight:600;font-size:14.5px;
  background:var(--surf2);border:1px solid var(--line);transition:transform .08s,background .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(135deg,#2A84CC,#3090D5 60%,#4FB0F2);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(48,144,213,.3)}
.btn[disabled]{opacity:.55;cursor:default}
.btn:focus-visible,.pcard:focus-visible,.cell:focus-visible,.opt:focus-visible,.seg button:focus-visible,.x:focus-visible{outline:3px solid rgba(48,144,213,.45);outline-offset:2px}

/* Chips */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--muted)}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.st{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}
.st-listo{background:var(--surf2);color:var(--muted)}
.st-programado{background:var(--prog-bg);color:var(--prog)}
.st-publicado{background:var(--green-bg);color:var(--green)}

/* Lo que sigue */
.next{display:grid;gap:14px}
.when{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--blue);background:#E8F2FC;padding:5px 10px;border-radius:999px}
.when.today{background:#E0F7EA;color:var(--green)}
.when.late{background:var(--red-bg);color:var(--red)}
.nextrow{display:flex;gap:14px;align-items:flex-start}
.nthumb{width:104px;aspect-ratio:4/5;object-fit:cover;border-radius:12px;background:#0b1220;flex:0 0 auto}
.nbody{display:grid;gap:8px;min-width:0;justify-items:start}
.pre{background:linear-gradient(180deg,#FFFBEB,#fff 70%);border-color:#F6E3B4}
.pre .kicker{color:var(--amber)}
.choice{display:grid;gap:10px}
@media(min-width:520px){.choice{grid-template-columns:1fr 1fr}}
.opt{display:flex;gap:12px;align-items:center;text-align:left;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:var(--shadow)}
.opt img{width:52px;aspect-ratio:4/5;object-fit:cover;border-radius:8px;background:#0b1220;flex:0 0 auto}
.opt b{display:block;font-size:14px}
.opt span{font-size:12.5px;color:var(--muted);line-height:1.35;display:block}
.opt .st{display:inline-block;margin-top:4px}
.count{font-size:12.5px;color:var(--amber);font-weight:600}

/* Progreso */
.ptop{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ptop b{font-size:15px;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:6px;background:var(--surf2);overflow:hidden;margin-top:10px;display:flex}
.bar i{display:block;height:100%;transition:width .4s}
.bar .b-pub{background:#22A25A}.bar .b-prog{background:#3090D5}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--muted)}
.legend b{color:var(--ink);font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}

/* Calendario */
.calhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.pillars{display:flex;gap:10px;flex-wrap:wrap}
.dow,.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dow{font-size:11px;font-weight:700;color:var(--faint);text-align:center;margin-bottom:6px;letter-spacing:.05em}
.cell{position:relative;aspect-ratio:1;border-radius:10px;background:var(--surf2);font-size:12px;font-weight:600;color:var(--muted);
  display:flex;align-items:flex-start;justify-content:flex-start;padding:5px 6px;overflow:hidden}
.cell.out{background:transparent;color:#C3CBD7}
.cell.post{background-size:cover;background-position:center top;color:#fff;cursor:pointer;box-shadow:inset 0 -3px 0 var(--c)}
.cell.post::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,16,28,.55),rgba(10,16,28,0) 55%)}
.cell.post span{position:relative}
.cell.today{outline:2.5px solid var(--bio);outline-offset:1px}
.cell .mk{position:absolute;right:4px;bottom:6px;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:800;color:#fff}
.mk.publicado{background:#22A25A}.mk.programado{background:#3090D5}
.cell.planb{background:#FFFBEB;border:1.5px dashed #E8C66B;color:var(--amber);cursor:pointer}
.cell.planb em{position:absolute;right:6px;bottom:4px;font-style:normal;font-size:10px;font-weight:800}

/* Lista */
.lhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.seg{display:inline-flex;background:var(--surf2);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{font-size:12.5px;font-weight:600;color:var(--muted);padding:7px 11px;border-radius:9px}
.seg button[aria-pressed="true"]{background:var(--surf);color:var(--ink);box-shadow:0 1px 3px rgba(15,27,45,.12)}
.week{margin-top:14px}
.wlabel{font-size:12px;font-weight:700;color:var(--faint);letter-spacing:.06em;text-transform:uppercase;margin:0 2px 8px}
.plist{display:grid;gap:10px}
.pcard{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surf);border:1px solid var(--line);
  border-radius:16px;padding:10px;box-shadow:var(--shadow);transition:transform .08s}
.pcard:active{transform:scale(.99)}
.pcard.done{opacity:.72}
.pthumb{width:64px;aspect-ratio:4/5;object-fit:cover;border-radius:10px;background:#0b1220;flex:0 0 auto}
.pbody{flex:1;min-width:0;display:grid;gap:3px}
.pdate{font-size:12.5px;font-weight:700;color:var(--blue)}
.pdate .late{color:var(--red)}
.ptitle{font-size:15px;font-weight:600;line-height:1.25}
.pmeta{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fmt{font-size:11.5px;color:var(--faint);font-weight:600}
.empty{padding:26px 10px;text-align:center;color:var(--muted);font-size:14px}

/* Hoja del post */
.ov{position:fixed;inset:0;z-index:50;background:rgba(15,27,45,.5);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center}
.ov[hidden]{display:none}
.sheet{background:var(--surf);width:100%;max-width:560px;max-height:94vh;overflow-y:auto;border-radius:22px 22px 0 0;
  padding:10px 16px calc(22px + env(safe-area-inset-bottom));animation:up .25s cubic-bezier(.2,.8,.2,1);outline:none}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:22px;max-height:90vh}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.mdate{font-size:13px;font-weight:700;color:var(--blue);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.x{width:36px;height:36px;border-radius:50%;background:var(--surf2);font-size:18px;flex:0 0 auto}
.slider{position:relative;margin:14px -16px 0}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;gap:10px;padding:0 16px}
.slides::-webkit-scrollbar{display:none}
.slides figure{flex:0 0 88%;scroll-snap-align:center;aspect-ratio:4/5;border-radius:14px;overflow:hidden;background:#0b1220}
.slides.one figure{flex-basis:100%}
.slides img{width:100%;height:100%;object-fit:cover}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.92);
  box-shadow:var(--shadow);font-size:18px;display:none}
@media(hover:hover) and (pointer:fine){.slider.multi .nav{display:block}}
.nav.l{left:22px}.nav.r{right:22px}
.dots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--bio);width:18px;border-radius:4px}
.note{margin-top:14px;background:var(--amber-bg);color:var(--amber);border-radius:12px;padding:10px 12px;font-size:13.5px;font-weight:600}
.note[hidden]{display:none}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.hint{font-size:12.5px;color:var(--muted);margin-top:8px;text-align:center}
.mstatus{margin-top:16px;display:flex;justify-content:center}
.mstatus .seg{width:100%}
.mstatus .seg button{flex:1}
.cap{margin-top:16px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.caphead{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:var(--surf2);font-size:12.5px;font-weight:700;color:var(--muted)}
.caphead button{color:var(--blue);font-weight:700;font-size:12.5px}
.cap pre{white-space:pre-wrap;font:14px/1.55 "Avenir Next","SF Pro Text",system-ui,sans-serif;padding:12px;color:var(--ink)}
.dl{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
.dl a{color:var(--blue);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;
  font-size:14px;font-weight:600;padding:11px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;z-index:60}
.toast.on{opacity:1;transform:translateX(-50%)}
footer{margin-top:28px;text-align:center;font-size:12px;color:var(--faint)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brandrow">
      <div class="brand"><img src="img/medusa.png" alt="" width="40" height="40"><div><b>Dusa Solutions</b><span>Plan de contenido</span></div></div>
      <nav class="links">
        <a href="https://business.facebook.com/latest/content_calendar" target="_blank" rel="noopener">Meta Business Suite ↗</a>
        <a href="https://www.instagram.com/dusasolutions/" target="_blank" rel="noopener">Instagram ↗</a>
      </nav>
    </div>
    <h1 id="h1"></h1>
    <p class="sub" id="sub"></p>
  </header>

  <div class="cols">
    <div class="stack side">
      <div id="pre"></div>
      <div id="next"></div>
      <section class="card" id="prog" aria-label="Progreso"></section>
      <section class="card" aria-labelledby="calT">
        <div class="calhead"><h3 id="calT">Calendario</h3><div class="pillars" id="pillars"></div></div>
        <div class="dow"><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span></div>
        <div class="grid7" id="grid"></div>
      </section>
    </div>

    <section class="card" aria-labelledby="listT">
      <div class="lhead">
        <h3 id="listT">Posts</h3>
        <div class="seg" id="filter">
          <button data-f="pend" aria-pressed="true">Pendientes</button>
          <button data-f="done" aria-pressed="false">Publicados</button>
          <button data-f="all" aria-pressed="false">Todos</button>
        </div>
      </div>
      <div id="list"></div>
    </section>
  </div>
  <footer id="foot"></footer>
</div>

<div class="ov" id="ov" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle" tabindex="-1">
    <div class="grab"></div>
    <div class="mhead">
      <div><div class="mdate" id="mDate"></div><h2 id="mTitle"></h2></div>
      <button class="x" id="mClose" aria-label="Cerrar">✕</button>
    </div>
    <div class="slider" id="slider">
      <div class="slides" id="slides"></div>
      <button class="nav l" id="prev" aria-label="Slide anterior">‹</button>
      <button class="nav r" id="nextS" aria-label="Slide siguiente">›</button>
    </div>
    <div class="dots" id="dots"></div>
    <p class="note" id="mNote" hidden></p>
    <div class="actions">
      <button class="btn" id="bCopy">① Copiar texto</button>
      <button class="btn primary" id="bShare">② Compartir</button>
    </div>
    <p class="hint" id="hint"></p>
    <div class="mstatus"><div class="seg" id="mStatus">
      <button data-s="listo">En cola</button><button data-s="programado">Programado</button><button data-s="publicado">Publicado</button>
    </div></div>
    <div class="cap"><div class="caphead">Texto para pegar <button id="bCopy2">Copiar</button></div><pre id="mCaption"></pre></div>
    <div class="dl" id="dl"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>

(() => {
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const PILLAR = { 'Producto': '#2E8BD6', 'Útil': '#16A34A', 'Detrás de cámaras': '#7C3AED', 'Estudio': '#D97706', 'Marca': '#DB2777' };
const ST = { listo: 'En cola', programado: 'Programado', publicado: 'Publicado' };
const DOW = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
const MON = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const KEY = 'dusaPlan.v2';

// ?hoy=2026-10-07 simula otra fecha (útil para revisar)
const parse = (iso) => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); };
const qHoy = new URLSearchParams(location.search).get('hoy');
const TODAY = qHoy ? parse(qHoy) : new Date(new Date().setHours(0, 0, 0, 0));
const days = (iso) => Math.round((parse(iso) - TODAY) / 864e5);
const fmt = (iso) => { const d = parse(iso); return `${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`; };
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch {}
const status = (p) => saved[p.id] || p.status;
const setStatus = (p, s) => { saved[p.id] = s; try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch {} render(); };

const POSTS = APP.posts;
const OCT = POSTS.filter(p => p.group === 'oct');
const PRE = POSTS.filter(p => p.group === 'pre');
const byId = Object.fromEntries(POSTS.map(p => [p.id, p]));

function whenLabel(p) {
  if (!p.date) return { txt: 'Cuando Blokku salga en Play', cls: '' };
  const d = days(p.date);
  if (status(p) === 'publicado') return { txt: cap(fmt(p.date)), cls: '' };
  if (d === 0) return { txt: 'Hoy · 7–8 pm', cls: 'today' };
  if (d === 1) return { txt: `Mañana · ${fmt(p.date)}`, cls: '' };
  if (d > 1) return { txt: `${cap(fmt(p.date))} · en ${d} días`, cls: '' };
  return { txt: `Atrasado ${-d} día${d === -1 ? '' : 's'} · era el ${fmt(p.date)}`, cls: 'late' };
}
const plural = (n, w) => n === 1 ? w : w + 's';
const format = (p) => p.slides.length > 1 ? `Carrusel · ${p.slides.length}` : 'Imagen';

function render() {

  $('#foot').textContent = APP.upd;

  // Antes de octubre: la decisión del anuncio (desaparece cuando se publica cualquiera de las dos)
  const preDone = PRE.some(p => status(p) === 'publicado');
  const toDecide = days('2026-09-30');
  $('#pre').innerHTML = preDone ? '' : `
    <section class="card pre next" aria-labelledby="preT">
      <div class="kicker">Antes de octubre</div>
      <h2 id="preT">Anuncio del estudio</h2>
      <p class="muted">Se publica el día que Blokku aparezca en Google Play. Ese día cambia también la bio y la portada.</p>
      <div class="choice">${PRE.map(p => `
        <button class="opt" data-open="${p.id}">
          <img src="${p.slides[0].thumb}" alt="">
          <div><b>${esc(p.short)}</b><span>${esc(p.when)}</span><span class="st st-${status(p)}">${ST[status(p)]}</span></div>
        </button>`).join('')}

    </section>`;

  // Lo que sigue: el siguiente post de octubre sin publicar

  if (!nxt) {
    $('#next').innerHTML = `<section class="card next"><div class="kicker">Octubre</div><h2>¡Octubre completo! 🎉</h2><p class="muted">Los 13 posts están publicados.</p></section>`;
  } else {
    const w = whenLabel(nxt);
    $('#next').innerHTML = `
      <section class="card next" aria-labelledby="nextT">
        <div class="kicker">Lo que sigue</div>
        <div class="nextrow">
          <img class="nthumb" src="${nxt.slides[0].thumb}" alt="">
          <div class="nbody">
            <span class="when ${w.cls}">${esc(w.txt)}</span>
            <h2 id="nextT">${esc(nxt.title)}</h2>
            <div class="pmeta"><span class="pill" style="--c:${PILLAR[nxt.pillar] || '#999'}">${esc(nxt.pillar)}</span><span class="fmt">${format(nxt)}</span></div>
          </div>
        </div>
        <button class="btn primary" data-open="${nxt.id}">Abrir para publicar</button>
      </section>`;
  }

  // Progreso de octubre
  const n = { publicado: 0, programado: 0, listo: 0 };
  OCT.forEach(p => n[status(p)]++);
  const pct = (x) => (100 * x / OCT.length).toFixed(1) + '%';
  $('#prog').innerHTML = `
    <div class="ptop"><span class="kicker">Octubre</span><b>${n.publicado} de ${OCT.length} ${plural(OCT.length, 'publicado')}</b></div>
    <div class="bar" role="img" aria-label="${n.publicado} publicados, ${n.programado} programados"><i class="b-pub" style="width:${pct(n.publicado)}"></i><i class="b-prog" style="width:${pct(n.programado)}"></i></div>
    <div class="legend"><span><i class="dot" style="background:#22A25A"></i><b>${n.publicado}</b> ${plural(n.publicado, 'publicado')}</span><span><i class="dot" style="background:#3090D5"></i><b>${n.programado}</b> ${plural(n.programado, 'programado')}</span><span><i class="dot" style="background:#CBD3DE"></i><b>${n.listo}</b> en cola</span></div>`;

  // Calendario: lunes 28 sep → domingo 1 nov
  $('#pillars').innerHTML = Object.entries(PILLAR).map(([k, c]) => `<span class="pill" style="--c:${c}">${k}</span>`).join('');
  const start = parse('2026-09-28'), cells = [];
  const byDate = Object.fromEntries(POSTS.filter(p => p.date).map(p => [p.date, p]));
  for (let i = 0; i < 35; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const iso = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    const p = byDate[iso], out = d.getMonth() !== 9, today = +d === +TODAY ? ' today' : '';
    if (p && p.group === 'pre') {
      cells.push(`<button class="cell planb${today}" data-open="${p.id}" aria-label="${d.getDate()} oct: ${esc(p.title)}"><span>${d.getDate()}</span><em>B</em></button>`);
    } else if (p) {
      const s = status(p);
      cells.push(`<button class="cell post${today}" data-open="${p.id}" style="--c:${PILLAR[p.pillar]};background-image:url('${p.slides[0].thumb}')" aria-label="${fmt(iso)}: ${esc(p.title)} (${ST[s]})"><span>${d.getDate()}</span>${s !== 'listo' ? `<i class="mk ${s}">${s === 'publicado' ? '✓' : '⏱'}</i>` : ''}</button>`);
    } else {
      cells.push(`<div class="cell${out ? ' out' : ''}${today}">${d.getDate()}</div>`);
    }
  }
  $('#grid').innerHTML = cells.join('');

  // Lista por semana
  const f = document.querySelector('#filter [aria-pressed="true"]').dataset.f;
  const keep = (p) => f === 'all' || (f === 'done' ? status(p) === 'publicado' : status(p) !== 'publicado');
  const card = (p) => {
    const s = status(p), w = whenLabel(p);
    return `<button class="pcard${s === 'publicado' ? ' done' : ''}" data-open="${p.id}">
      <img class="pthumb" src="${p.slides[0].thumb}" alt="" loading="lazy">
      <div class="pbody">
        <div class="pdate"><span class="${w.cls === 'late' ? 'late' : ''}">${esc(w.txt)}</span></div>
        <div class="ptitle">${esc(p.title)}</div>
        <div class="pmeta"><span class="pill" style="--c:${PILLAR[p.pillar] || '#999'}">${esc(p.pillar)}</span><span class="fmt">${format(p)}</span></div>
      </div>
      <span class="st st-${s}">${ST[s]}</span>
    </button>`;
  };
  const groups = [];
  const pre = PRE.filter(keep);
  if (pre.length) groups.push(['Antes de octubre', pre]);
  const weeks = {};
  OCT.filter(keep).forEach(p => {
    const d = parse(p.date), mon = new Date(d); mon.setDate(d.getDate() - ((d.getDay() + 6) % 7));
    const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
    const k = +mon;
    (weeks[k] ||= { label: `${mon.getDate()} ${MON[mon.getMonth()]} – ${sun.getDate()} ${MON[sun.getMonth()]}`, items: [] }).items.push(p);
  });
  Object.keys(weeks).sort().forEach(k => groups.push([`Semana del ${weeks[k].label}`, weeks[k].items]));
  $('#list').innerHTML = groups.length
    ? groups.map(([label, items]) => `<div class="week"><div class="wlabel">${label}</div><div class="plist">${items.map(card).join('')}</div></div>`).join('')
    : `<p class="empty">${f === 'done' ? 'Todavía no hay posts publicados.' : '¡No queda nada pendiente! 🎉'}</p>`;

  if (current) paintSheetStatus();
}

document.addEventListener('click', (e) => {
  const o = e.target.closest('[data-open]'); if (o) openSheet(byId[o.dataset.open], o);
  const fb = e.target.closest('#filter button');
  if (fb) { document.querySelectorAll('#filter button').forEach(b => b.setAttribute('aria-pressed', b === fb)); render(); }
});

// ---------- Hoja del post ----------
let current = null, lastFocus = null, files = null;
const ov = $('#ov'), slidesEl = $('#slides');

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2200); }

async function copyCaption() {
  try { await navigator.clipboard.writeText(current.caption); }
  catch { const ta = document.createElement('textarea'); ta.value = current.caption; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  toast('Texto copiado ✓');
}

function paintSheetStatus() {
  const s = status(current);
  document.querySelectorAll('#mStatus button').forEach(b => b.setAttribute('aria-pressed', b.dataset.s === s));
}

async function prepareFiles(p) {
  files = null;
  const btn = $('#bShare');
  btn.disabled = true; btn.textContent = '② Preparando…';
  try {
    const list = await Promise.all(p.slides.map(async (s, i) => {
      const blob = await (await fetch(s.full)).blob();
      return new File([blob], `dusa-${p.id}-${i + 1}.jpg`, { type: 'image/jpeg' });
    }));
    if (current !== p) return;
    files = list;
    const canShare = navigator.canShare && navigator.canShare({ files });
    btn.textContent = canShare ? '② Compartir' : '② Descargar';
    $('#hint').textContent = canShare
      ? 'Elige Instagram (o “Guardar imágenes”) y pega el texto que copiaste.'
      : 'Se descargan en orden. Súbelas en Meta Business Suite y pega el texto.';
    btn.disabled = false;
  } catch {
    btn.textContent = '② Descargar'; btn.disabled = false; files = null;
  }
}

async function shareOrDownload() {
  if (files && navigator.canShare && navigator.canShare({ files })) {
    try { await navigator.share({ files }); } catch (e) { if (e.name !== 'AbortError') toast('No se pudo compartir; usa los links de abajo'); }
    return;
  }
  for (const [i, s] of current.slides.entries()) {
    const a = document.createElement('a');
    a.href = files ? URL.createObjectURL(files[i]) : s.full; a.download = `dusa-${current.id}-${i + 1}.jpg`;
    document.body.appendChild(a); a.click(); a.remove();
    await new Promise(r => setTimeout(r, 350));
  }
  toast(`${current.slides.length} imagen${current.slides.length > 1 ? 'es' : ''} descargada${current.slides.length > 1 ? 's' : ''}`);
}

function openSheet(p, from) {
  current = p; lastFocus = from || document.activeElement;
  const w = whenLabel(p);
  $('#mDate').innerHTML = `<span>${esc(w.txt)}</span><span class="pill" style="--c:${PILLAR[p.pillar] || '#999'}">${esc(p.pillar)}</span><span class="fmt">${format(p)}</span>`;
  $('#mTitle').textContent = p.title;
  slidesEl.className = 'slides' + (p.slides.length === 1 ? ' one' : '');
  slidesEl.innerHTML = p.slides.map((s, i) => `<figure><img src="${s.full}" alt="${esc(p.title)} — ${i + 1} de ${p.slides.length}" ${i ? 'loading="lazy"' : ''}></figure>`).join('');
  slidesEl.scrollLeft = 0;
  $('#slider').classList.toggle('multi', p.slides.length > 1);
  $('#dots').innerHTML = p.slides.length > 1 ? p.slides.map((_, i) => `<i class="${i ? '' : 'on'}"></i>`).join('') : '';
  const note = $('#mNote'); note.hidden = !p.note; note.textContent = p.note ? '⚠️ ' + p.note : '';
  $('#mCaption').textContent = p.caption;
  $('#dl').innerHTML = `Imágenes: ${p.slides.map((s, i) => `<a href="${s.full}" download="dusa-${p.id}-${i + 1}.jpg">${p.slides.length > 1 ? i + 1 : 'descargar'}</a>`).join(' · ')}`;
  $('#hint').textContent = '';
  paintSheetStatus();
  ov.hidden = false; document.body.style.overflow = 'hidden';
  $('#sheet').scrollTop = 0; $('#sheet').focus();
  prepareFiles(p);
}
function closeSheet() {
  ov.hidden = true; document.body.style.overflow = ''; current = null; files = null;
  lastFocus && lastFocus.focus && lastFocus.focus();
}

slidesEl.addEventListener('scroll', () => {
  const w = slidesEl.firstElementChild?.getBoundingClientRect().width || 1;
  const i = Math.round(slidesEl.scrollLeft / (w + 10));
  document.querySelectorAll('#dots i').forEach((d, k) => d.classList.toggle('on', k === i));
}, { passive: true });
const step = (dir) => { const w = slidesEl.firstElementChild.getBoundingClientRect().width + 10; slidesEl.scrollBy({ left: dir * w, behavior: 'smooth' }); };
$('#prev').onclick = () => step(-1);
$('#nextS').onclick = () => step(1);
$('#mClose').onclick = closeSheet;
ov.addEventListener('click', (e) => { if (e.target === ov) closeSheet(); });
$('#bCopy').onclick = copyCaption;
$('#bCopy2').onclick = copyCaption;
$('#bShare').onclick = shareOrDownload;
$('#mStatus').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  setStatus(current, b.dataset.s); toast(`Marcado como ${ST[b.dataset.s].toLowerCase()}`);
});
document.addEventListener('keydown', (e) => {
  if (ov.hidden) return;
  if (e.key === 'Escape') closeSheet();
  if (e.key === 'ArrowRight') step(1);
  if (e.key === 'ArrowLeft') step(-1);
  if (e.key === 'Tab') {
    const f = [...$('#sheet').querySelectorAll('button,a[href]')].filter(el => el.offsetParent);
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  }
});

render();
})();
</script>
</body>
</html>
